---
# This workflow warns and then closes issues and PRs that have had no activity for a specified amount of time.
# For more information, see: https://github.com/actions/stale
name: 'Close Stale Issues and PRs'

on:
  schedule:
    # Runs at 02:33 UTC every day. You can adjust the schedule as needed.
    - cron: '33 2 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest

    # Minimal permissions for the GITHUB_TOKEN to allow the action to modify issues and PRs.
    permissions:
      issues: write
      pull-requests: write

    steps:
      # Pinned to the v9.1.0 commit SHA for supply-chain integrity (instead of a mutable tag).
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639  # v9.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs.
            Thank you for your contributions.

          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs.
            Thank you for your contributions.

          stale-issue-label: 'stale'
          stale-pr-label: 'stale'

          # Days of inactivity before an issue or PR is marked as stale.
          days-before-stale: 60

          # Days of inactivity before a stale issue or PR is closed. Set to -1 to disable closing.
          days-before-close: 7

          # Labels that prevent an issue or PR from being marked as stale.
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'pinned,security'

          exempt-all-issue-assignees: true
          exempt-all-pr-assignees: true

          operations-per-run: 100
