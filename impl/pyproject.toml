[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-sec"
version = "0.1.0"
description = "Reference implementation of the Foundry Security Spec"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "click>=8.1",
    "httpx>=0.26",
    "tenacity>=8.2",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-mistralai>=0.2",
    "mistralai>=1.2",
    "structlog>=24.1",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
foundry = "foundry.cli:cli"

[tool.setuptools.packages.find]
include = ["foundry*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
